function sentBar(pos,neg,neu){
  const t=pos+neg+neu||1;
  const pp=(pos/t*100).toFixed(0),np=(neg/t*100).toFixed(0),nup=(neu/t*100).toFixed(0);
  return `<div class="sbar tt" data-tip="✅ ${pp}% Pos | ❌ ${np}% Neg | ⬜ ${nup}% Neu"><div class="sp" style="width:${pp}%"></div><div class="sn" style="width:${nup}%"></div><div class="sg" style="width:${np}%"></div></div>`;
}

function funnel(f){
  const colors={"TAKEN TO WORK":"#1a4a8a","CONTACT ESTABLISHED":"#0e7490","MEETING SCHEDULED":"#0891b2","MEETING ATTENDED":"#16a34a","MEETING NOT ATTENDED":"#d97706","CLOSED-LOST":"#dc2626","SUCCESSFUL PAYMENT":"#15803d","READY TO PAY":"#059669","HIGH SCORE":"#7c3aed"};
  const order=["HIGH SCORE","TAKEN TO WORK","CONTACT ESTABLISHED","MEETING SCHEDULED","MEETING NOT ATTENDED","MEETING ATTENDED","READY TO PAY","SUCCESSFUL PAYMENT","CLOSED-LOST"];
  const items=order.filter(s=>f[s]>0).map(s=>[s,f[s]]);
  const mx=Math.max(...items.map(([,v])=>v));
  return items.map(([s,c])=>`<div class="fr"><div class="fl">${s}</div><div class="fbw"><div class="fb" style="width:${(c/mx*100).toFixed(0)}%;background:${colors[s]||'#1a4a8a'}">${c>=5?c:''}</div></div><div class="fc">${c}</div></div>`).join('');
}

function utm(u){
  const items=Object.entries(u).sort(([,a],[,b])=>b-a);
  const mx=Math.max(...items.map(([,v])=>v));
  return items.map(([n,c])=>`<div class="ur"><div class="un">${n}</div><div class="ubw"><div class="ub" style="width:${(c/mx*100).toFixed(0)}%"></div></div><div class="uc">${c}</div></div>`).join('');
}

    <div class="sec"><div class="sec-t">✅ Todas as Reuniões Atendidas — Fds</div>${attendedTable(allAtt)}</div>
    </div>`;
  }
  return `<div class="content">${kpis(k)}
  <div class="sec"><div class="sec-t">👥 Performance Closers — Consolidado</div>${closerTable(perf)}</div>
  <div class="sec"><div class="sec-t">🏆 Potencial A — Prioridade Segunda-feira</div>${potTable(allAtt)}</div>
  <div class="sec"><div class="sec-t">🐘 Transcrições Elephan — Fds Completo (${allEph.length} calls)</div>${elephanTable(allEph)}</div>
  <div class="sec"><div class="sec-t">📊 Scorecard por Closer — Fds</div>${scorecardTable()}</div>
  <div class="sec"><div class="sec-t">🚨 Alertas e Recomendações</div>
    <div class="al al-r"><div class="al-h">🚨 Taxa de no-show: ${nsr}% — 41 faltas no fds</div><div class="al-d">9 leads high priority faltaram no sábado (Keverton score 9, Beatriz score 8, João Pedro score 6). Contato de reagendamento hoje de manhã.</div></div>
    <div class="al al-y"><div class="al-h">⚠ Conversão 2.3% (1 venda em 44 reuniões)</div><div class="al-d">Principal padrão Elephan: objeção financeira + adiamento 2-3 meses. EBAC mencionada como concorrente com financiamento próprio. Preparar contra-argumentação para semana.</div></div>
    <div class="al al-g"><div class="al-h">✅ 11 leads Potencial A identificados — janela quente</div><div class="al-d">Contato de todos antes das 12h: Mariana Nery (MBA DS, score 4, Quente), Danielle Pena (DS, score 4), Pedro Ivo (MBA DS, score 4), Crístian Goettmes (DA, score 3), Rafaela França (DA, score 4).</div></div>
    <div class="al al-b"><div class="al-h">📚 Treinamento prioritário: Raisa (6.05) e Yanara (6.40)</div><div class="al-d">Dois closers abaixo de 6.5 com múltiplos calls. Roleplay antes das reuniões desta semana. Usar Bruno Marques (8.5) como benchmark.</div></div>
  </div>
  <div class="sec"><div class="sec-t">📚 Recomendações de Treinamento</div>${training()}</div>
  </div>`;
}

function render(){
  if(cDay==='consolidado'){document.getElementById('app').innerHTML=renderConsolidado();return;}
  const d=DATA[cDay];
  const eph=cDay==='sexta'?ELEPHAN_FRI:ELEPHAN_SAT;
  const label=cDay==='sexta'?'Sexta 14/08':'Sábado 15/08';
  if(cTab==='marketing'){
    document.getElementById('app').innerHTML=`<div class="content">${kpis(d.kpis)}
    <div class="two-col">
      <div class="sec"><div class="sec-t">📊 Funil — ${label}</div>${funnel(d.funnel)}</div>
      <div class="sec"><div class="sec-t">📡 UTM Medium — ${label}</div>${utm(d.utm)}</div>
    </div>
    <div class="sec"><div class="sec-t">✅ Reuniões Atendidas — ${label}</div>${attendedTable(d.attended)}</div>
    <div class="sec"><div class="sec-t">⚠ No-shows — ${label}</div>${noshowTable(d.noshows)}</div>
    </div>`;
  } else {
    document.getElementById('app').innerHTML=`<div class="content">${kpis(d.kpis)}
    <div class="sec"><div class="sec-t">👥 Performance por Closer — ${label}</div>${closerTable(d.closer_perf)}</div>
    <div class="sec"><div class="sec-t">🏆 Ranking Potencial A/B — ${label}</div>${potTable(d.attended)}</div>
    <div class="sec"><div class="sec-t">🐘 Transcrições Elephan — ${label} (${eph.length} calls)</div>${elephanTable(eph)}</div>
    <div class="sec"><div class="sec-t">📊 Scorecard por Closer — Fds</div>${scorecardTable()}</div>
    <div class="sec"><div class="sec-t">🚨 Alertas Críticos — ${label}</div>${alerts(d)}</div>
    <div class="sec"><div class="sec-t">📚 Recomendações de Treinamento</div>${training()}</div>
    </div>`;
  }
}
window.onload=function(){render();};
</script>
