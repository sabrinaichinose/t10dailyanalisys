<style>
:root{
  --navy-900:#0c1c33; --navy-800:#12294a; --navy-700:#1b3a63; --navy-600:#254c7f;
  --blue-500:#2a78d6; --blue-400:#4f93e6; --blue-100:#e4f0fd; --teal-500:#1baf7a; --teal-600:#0f8f63; --teal-100:#e1f7ef;
  --good:#0ca30c; --warning:#c98500; --critical:#d03b3b; --critical-bg:#fbe6e6;
  --surface:#ffffff; --page:#f4f7fb; --ink:#0f1b2d; --ink-2:#4b5a71; --muted:#8b96a5;
  --border:#e2e8f0; --hairline:#eef2f7;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box;}
body{margin:0; background:var(--page); color:var(--ink); font-size:14px; line-height:1.5;}
header.top{background:linear-gradient(135deg,var(--navy-900),var(--navy-700)); color:#fff; padding:24px 32px 16px;}
header.top h1{margin:0 0 4px; font-size:22px; font-weight:700;}
header.top .sub{color:#c7d6ec; font-size:13.5px;}
.badge-warn-bar{background:#fff3cd; color:#7a5c00; border:1px solid #f0d78a; padding:10px 32px; font-size:13px;}
.course-filter-bar{display:flex; align-items:center; gap:12px; padding:12px 32px; background:var(--navy-800); border-top:1px solid rgba(255,255,255,0.08); flex-wrap:wrap;}
.course-filter-bar .flabel{color:#a9bcd6; font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;}
.seg{display:flex; background:rgba(255,255,255,0.08); border-radius:8px; padding:3px;}
.seg button{background:transparent; border:none; color:#c7d6ec; padding:7px 18px; font-size:13px; font-weight:600; border-radius:6px; cursor:pointer;}
.seg button.active{background:var(--teal-500); color:#fff;}
.tabs{display:flex; gap:4px; padding:0 32px; background:var(--navy-900); border-top:1px solid rgba(255,255,255,0.08);}
.tab-btn{background:transparent; border:none; color:#a9bcd6; padding:14px 20px; font-size:14px; font-weight:600; cursor:pointer; border-bottom:3px solid transparent;}
.tab-btn.active{color:#fff; border-bottom-color:var(--teal-500); background:rgba(255,255,255,0.04);}
main{padding:24px 32px 60px; max-width:1440px; margin:0 auto;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}
h2.section-title{font-size:16px; font-weight:700; color:var(--navy-800); margin:32px 0 12px; padding-bottom:8px; border-bottom:2px solid var(--hairline); display:flex; align-items:center; gap:8px;}
h2.section-title:first-child{margin-top:0;}
.kpi-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:8px;}
.kpi-card{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 16px; box-shadow:0 1px 2px rgba(12,28,51,0.04);}
.kpi-card .label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; font-weight:600; margin-bottom:6px;}
.kpi-card .value{font-size:23px; font-weight:700; color:var(--navy-900); font-variant-numeric:tabular-nums;}
.kpi-card .value.teal{color:var(--teal-600);} .kpi-card .value.critical{color:var(--critical);}
.kpi-card .sub{font-size:11px; color:var(--muted); margin-top:4px;}
.funnel{display:flex; flex-direction:column; gap:6px; margin:16px 0;}
.funnel-row{display:grid; grid-template-columns:220px 1fr 60px; align-items:center; gap:10px; font-size:13px;}
.funnel-row .fname{color:var(--ink-2); font-weight:600;}
.funnel-bar-track{background:var(--hairline); border-radius:4px; height:22px; overflow:hidden;}
.funnel-bar-fill{background:linear-gradient(90deg,var(--blue-500),var(--teal-500)); height:100%; border-radius:4px; min-width:2px;}
.funnel-row .fcount{text-align:right; font-weight:700; color:var(--navy-800); font-variant-numeric:tabular-nums;}
.card{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:18px; margin-bottom:20px; box-shadow:0 1px 2px rgba(12,28,51,0.04);}
.card h3{margin:0 0 4px; font-size:14.5px; font-weight:700; color:var(--navy-800);}
.card .card-desc{font-size:12.5px; color:var(--muted); margin-bottom:12px;}
.filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px;}
.filters select{padding:6px 10px; border:1px solid var(--border); border-radius:6px; font-size:12.5px; background:#fff; color:var(--ink-2);}
table{width:100%; border-collapse:collapse; font-size:12.6px;}
thead th{background:var(--navy-900); color:#fff; text-align:left; padding:9px 10px; font-weight:600; font-size:11.2px; text-transform:uppercase; letter-spacing:.03em; position:sticky; top:0;}
tbody td{padding:8px 10px; border-bottom:1px solid var(--hairline); color:var(--ink-2);}
tbody tr:nth-child(even){background:#f8fafc;}
tbody tr:hover{background:var(--blue-100);}
.table-scroll{max-height:420px; overflow:auto; border:1px solid var(--hairline); border-radius:8px;}
.badge{display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:700; white-space:nowrap;}
.badge-quente{background:#fbe6e6; color:#b23a3a;} .badge-morno{background:#fff2df; color:#a5680b;} .badge-frio{background:var(--blue-100); color:#2a5ea8;}
.badge-high{background:#fbe6e6; color:#b23a3a;} .badge-medium{background:#fff2df; color:#a5680b;} .badge-low{background:var(--hairline); color:var(--muted);}
.badge-pay-yes{background:var(--teal-100); color:var(--teal-600);} .badge-pay-no{background:var(--hairline); color:var(--muted);}

.badge-pot-a{background:var(--teal-100); color:var(--teal-600); font-weight:800;} .badge-pot-b{background:#fff2df; color:#a5680b; font-weight:800;} .badge-pot-c{background:var(--hairline); color:var(--muted); font-weight:800;}
.badge-mba{background:#eae4fb; color:#5a3fc0;} .badge-boot{background:var(--blue-100); color:#2a5ea8;}
.badge-cohort-today{background:var(--teal-100); color:var(--teal-600);} .badge-cohort-other{background:var(--hairline); color:var(--muted);}
.no-data-banner{background:#fff3cd; border:1px solid #f0d78a; color:#7a5c00; border-radius:10px; padding:20px; text-align:center; font-size:13.5px;}
.no-data-banner .icon{font-size:28px; display:block; margin-bottom:8px;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
@media (max-width:900px){.two-col{grid-template-columns:1fr;}}
.chip-list{list-style:none; padding:0; margin:0;}
.chip-list li{padding:9px 12px; border-left:3px solid var(--critical); background:#fff8f8; border-radius:0 6px 6px 0; margin-bottom:8px; font-size:13px; color:var(--ink-2);}
.chip-list.reco li{border-left-color:var(--teal-500); background:var(--teal-100); color:var(--navy-800);}
.foot{text-align:center; color:var(--muted); font-size:12px; padding:20px 0 0;}
.valid-table{width:100%; border-collapse:collapse; font-size:12.8px;}
.valid-table th{text-align:left; padding:8px 10px; color:var(--muted); font-size:11px; text-transform:uppercase; border-bottom:2px solid var(--hairline);}
.valid-table td{padding:8px 10px; border-bottom:1px solid var(--hairline);}
.match-ok{color:var(--teal-600); font-weight:700;} .match-diff{color:var(--critical); font-weight:700;}
.pill-scope{display:inline-block; background:var(--blue-100); color:#2a5ea8; padding:2px 10px; border-radius:20px; font-size:11px; font-weight:700; margin-left:8px;}
.sent-bar{display:flex; height:8px; width:110px; border-radius:4px; overflow:hidden; background:var(--hairline);}

function sentBar(pos,neg){
  if(pos===null || pos===undefined) return '<span style="color:var(--muted); font-style:italic;">sem dados</span>';
  const p = Math.max(0,Math.min(100,pos||0)), n = Math.max(0,Math.min(100,neg||0)), neu = Math.max(0,100-p-n);
  return `<div class="sent-bar"><div class="pos" style="width:${p}%"></div><div class="neg" style="width:${n}%"></div><div class="neu" style="width:${neu}%"></div></div>`;
}

function renderFunnel(funil){
  if(!funil.length) return '<div class="card-desc">Sem registros para este filtro.</div>';
  const max = Math.max(...funil.map(f=>f[1]));
  return '<div class="funnel">' + funil.map(f=>`
    <div class="funnel-row"><div class="fname">${esc(f[0])}</div>
      <div class="funnel-bar-track"><div class="funnel-bar-fill" style="width:${Math.max(2,100*f[1]/max)}%"></div></div>
      <div class="fcount">${f[1]}</div></div>`).join('') + '</div>';
}

function buildFilterBar(id, columns){
  return `<div class="filters" id="filters-${id}">` + columns.map(c=>`
    <select data-col="${c.key}" onchange="applyFilters('${id}')"><option value="">${esc(c.label)}: Todos</option></select>
  `).join('') + '</div>';
}
function populateFilterOptions(id, rows, columns){
  columns.forEach(c=>{
    const sel = document.querySelector(`#filters-${id} select[data-col="${c.key}"]`);
    if(!sel) return;
    sel.innerHTML = `<option value="">${esc(c.label)}: Todos</option>`;
    const vals = [...new Set(rows.map(r=>r[c.key]).filter(v=>v!==undefined && v!==null && v!==''))].sort();
    vals.forEach(v=>{ const opt=document.createElement('option'); opt.value=v; opt.textContent=v; sel.appendChild(opt); });
  });
}
function applyFilters(id){
  const table = document.getElementById(`tbody-${id}`);
  const selects = document.querySelectorAll(`#filters-${id} select`);
  const active = {}; selects.forEach(s=>{ if(s.value) active[s.dataset.col]=s.value; });
  table.querySelectorAll('tr').forEach(tr=>{
    let show=true;
    for(const col in active){ if(tr.dataset[col]!==active[col]){show=false;break;} }
    tr.style.display = show ? '' : 'none';
  });
}
function tbl(id, headers, rows, rowFn, filterCols){
  const filterHtml = filterCols ? buildFilterBar(id, filterCols) : '';
  return `${filterHtml}<div class="table-scroll"><table>
    <thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
    <tbody id="tbody-${id}">${rows.map(rowFn).join('')}</tbody></table></div>`;
}

    ["Pagamentos — leads criados ontem", v.pagamentos_ontem],
    ["Closed-lost — leads criados ontem", v.closed_lost_ontem],
    ["Reuniões agendadas — leads criados ontem", v.reunioes_agendadas_ontem],
    ["No-show — leads criados ontem", v.no_show_ontem],
    ["Reuniões atendidas — leads criados ontem", v.reunioes_atendidas_ontem],
    ["Pagamentos — total de ações no dia", v.pagamentos_total_acoes],
    ["Closed-lost — total de ações no dia", v.closed_lost_total_acoes],
    ["Reuniões agendadas — total de ações no dia", v.reunioes_agendadas_total_acoes],
    ["No-show — total de ações no dia", v.no_show_total_acoes],
    ["Reuniões atendidas — total de ações no dia", v.reunioes_atendidas_total_acoes],
  ];
  return `<div class="card">
    <h3>Validação manual vs. dados via API${scopeNote}</h3>
    <div class="card-desc">Os KPIs e tabelas deste dashboard são calculados a partir dos registros via API do HubSpot (por isso respondem ao filtro de curso). Esta tabela compara esse total ("Via API", escopo "Todos") com números conferidos manualmente, quando fornecidos.</div>
    <table class="valid-table"><thead><tr><th>Métrica</th><th>Reportado</th><th>Via API</th><th>Diferença</th></tr></thead><tbody>
    ${rows.map(([label,o])=>{
      const diff = o.computado - o.reportado;
      const cls = diff===0 ? 'match-ok' : 'match-diff';
      return `<tr><td>${esc(label)}</td><td>${o.reportado}</td><td>${o.computado}</td><td class="${cls}">${diff===0?'✓ igual':(diff>0?'+':'')+diff}</td></tr>`;
    }).join('')}
    </tbody></table>
  </div>`;
}

function renderMarketing(){
  const m = DATA;
  const leadsRows = filterByCourse(m.tables.leads_criados);
  const schedRows = filterByCourse(m.tables.meeting_scheduled);
  const attRows = filterByCourse(m.tables.attended);
  const noshowRows = filterByCourse(m.tables.noshows);
  const lostRows = filterByCourse(m.tables.closed_lost);
  const payRows = filterByCourse(m.tables.payments);

  let out = '';
  out += kpiRow([
    {label:'Leads Criados (ontem)', value: m.kpis_by_course.leads_criados[COURSE]},
    {label:'Reuniões Agendadas (ações no dia)', value: m.kpis_by_course.meeting_scheduled[COURSE].total, sub:`${m.kpis_by_course.meeting_scheduled[COURSE].criado_ontem} criado ontem + ${m.kpis_by_course.meeting_scheduled[COURSE].outro_dia} outros dias`},
    {label:'No-Shows (ações no dia)', value: m.kpis_by_course.noshows[COURSE].total, cls:'critical', sub:`${m.kpis_by_course.noshows[COURSE].criado_ontem} criado ontem + ${m.kpis_by_course.noshows[COURSE].outro_dia} outros dias`},
    {label:'Reuniões Atendidas (ações no dia)', value: m.kpis_by_course.attended[COURSE].total, cls:'teal', sub:`${m.kpis_by_course.attended[COURSE].criado_ontem} criado ontem + ${m.kpis_by_course.attended[COURSE].outro_dia} outros dias`},
    {label:'Pagamentos (ações no dia)', value: m.kpis_by_course.payments[COURSE].total, cls:'teal', sub:`${m.kpis_by_course.payments[COURSE].criado_ontem} criado ontem + ${m.kpis_by_course.payments[COURSE].outro_dia} outros dias`},
    {label:'Closed-Lost (ações no dia)', value: m.kpis_by_course.closed_lost[COURSE].total, cls:'critical', sub:`${m.kpis_by_course.closed_lost[COURSE].criado_ontem} criado ontem + ${m.kpis_by_course.closed_lost[COURSE].outro_dia} outros dias`},
  ]);

  out += renderValidacao();

  out += '<h2 class="section-title">Funil de Leads Criados (por estágio)</h2>';
  out += '<div class="card">' + renderFunnel(m.funil_by_course[COURSE]) + '</div>';

  out += '<h2 class="section-title">Leads Criados em '+m.target_date_br+'</h2>';
  out += '<div class="card">' + tbl('leadsCriados', ['Lead','Curso','Categoria','UTM Medium','Priority','Score','Temperatura','Resultado'], leadsRows,
    r=>`<tr data-utm_medium="${esc(r.utm_medium)}" data-priority="${esc(r.priority)}" data-temperatura="${esc(r.temperatura)}">
      <td>${esc(r.dealname)}</td><td>${esc(r.course)}</td><td>${courseBadge(r.course_cat)}</td><td>${esc(r.utm_medium)}</td>
      <td>${prioBadge(r.priority)}</td><td>${esc(r.score)}</td><td>${tempBadge(r.temperatura)}</td><td>${resultBadge(r.resultado)}</td></tr>`,
    [{key:'utm_medium',label:'UTM Medium'},{key:'priority',label:'Priority'},{key:'temperatura',label:'Temperatura'}]
  ) + '</div>';
  populateFilterOptions('leadsCriados', leadsRows, [{key:'utm_medium'},{key:'priority'},{key:'temperatura'}]);

  out += '<h2 class="section-title">Reuniões Agendadas — ações ocorridas em '+m.target_date_br+'</h2>';
  out += '<div class="card"><div class="card-desc">Inclui leads criados ontem e em outros dias que entraram em "Meeting Scheduled" nesta data.</div>' +
    tbl('sched', ['Lead','Curso','Categoria','Cohort','UTM Medium','UTM Source','Priority','Score'], schedRows,
    r=>`<tr data-utm_medium="${esc(r.utm_medium)}" data-priority="${esc(r.priority)}" data-cohort="${esc(r.cohort)}">
      <td>${esc(r.dealname)}</td><td>${esc(r.course)}</td><td>${courseBadge(r.course_cat)}</td><td>${cohortBadge(r.cohort)}</td>
      <td>${esc(r.utm_medium)}</td><td>${esc(r.utm_source)}</td><td>${prioBadge(r.priority)}</td><td>${esc(r.score)}</td></tr>`,
    [{key:'utm_medium',label:'UTM Medium'},{key:'priority',label:'Priority'},{key:'cohort',label:'Cohort'}]
  ) + '</div>';
  populateFilterOptions('sched', schedRows, [{key:'utm_medium'},{key:'priority'},{key:'cohort'}]);

  out += '<h2 class="section-title">No-Shows — ações ocorridas em '+m.target_date_br+'</h2>';
  out += '<div class="card"><div class="card-desc">Nota: a propriedade de data de no-show registra apenas a última ocorrência por negócio — o total pode subcontar leads com mais de um no-show.</div>' +
    tbl('noshow', ['Lead','Curso','Categoria','Cohort','UTM Medium','Priority','Score','Data Criação'], noshowRows,
    r=>`<tr data-utm_medium="${esc(r.utm_medium)}" data-priority="${esc(r.priority)}" data-cohort="${esc(r.cohort)}">
      <td>${esc(r.dealname)}</td><td>${esc(r.course)}</td><td>${courseBadge(r.course_cat)}</td><td>${cohortBadge(r.cohort)}</td>
      <td>${esc(r.utm_medium)}</td><td>${prioBadge(r.priority)}</td><td>${esc(r.score)}</td><td>${esc(r.createdate)}</td></tr>`,
    [{key:'utm_medium',label:'UTM Medium'},{key:'priority',label:'Priority'},{key:'cohort',label:'Cohort'}]
  ) + '</div>';
  populateFilterOptions('noshow', noshowRows, [{key:'utm_medium'},{key:'priority'},{key:'cohort'}]);

  out += '<h2 class="section-title">Todas as Reuniões Atendidas em '+m.target_date_br+'</h2>';
  out += '<div class="card">' + tbl('attFull', ['Lead','Closer','Curso','Categoria','Cohort','UTM Medium','Priority','Score','Temperatura','Payable','Ciclo (d)','Resultado'], attRows,
    r=>`<tr data-utm_medium="${esc(r.utm_medium)}" data-priority="${esc(r.priority)}" data-temperatura="${esc(r.temperatura)}" data-cohort="${esc(r.cohort)}">
      <td>${esc(r.dealname)}</td><td>${esc(r.closer)}</td><td>${esc(r.course)}</td><td>${courseBadge(r.course_cat)}</td><td>${cohortBadge(r.cohort)}</td>
      <td>${esc(r.utm_medium)}</td><td>${prioBadge(r.priority)}</td><td>${esc(r.score)}</td><td>${tempBadge(r.temperatura)}</td>
      <td>${payBadge(r.payable)}</td><td>${esc(r.ciclo)}</td><td>${resultBadge(r.resultado)}</td></tr>`,
    [{key:'utm_medium',label:'UTM Medium'},{key:'priority',label:'Priority'},{key:'temperatura',label:'Temperatura'},{key:'cohort',label:'Cohort'}]
  ) + '</div>';
  populateFilterOptions('attFull', attRows, [{key:'utm_medium'},{key:'priority'},{key:'temperatura'},{key:'cohort'}]);

  out += '<h2 class="section-title">Pagamentos — ações ocorridas em '+m.target_date_br+'</h2>';
  out += '<div class="card">' + tbl('pay', ['Lead','Closer','Curso','Categoria','Cohort'], payRows,
    r=>`<tr><td>${esc(r.dealname)}</td><td>${esc(r.closer)}</td><td>${esc(r.course)}</td><td>${courseBadge(r.course_cat)}</td><td>${cohortBadge(r.cohort)}</td></tr>`
  ) + '</div>';

  out += '<h2 class="section-title">Closed-Lost — ações ocorridas em '+m.target_date_br+'</h2>';
  out += '<div class="card">' + tbl('lost', ['Lead','Curso','Categoria','Cohort','UTM Medium','Priority'], lostRows,
    r=>`<tr data-utm_medium="${esc(r.utm_medium)}" data-priority="${esc(r.priority)}" data-cohort="${esc(r.cohort)}">
      <td>${esc(r.dealname)}</td><td>${esc(r.course)}</td><td>${courseBadge(r.course_cat)}</td><td>${cohortBadge(r.cohort)}</td>
      <td>${esc(r.utm_medium)}</td><td>${prioBadge(r.priority)}</td></tr>`,
    [{key:'utm_medium',label:'UTM Medium'},{key:'priority',label:'Priority'},{key:'cohort',label:'Cohort'}]
  ) + '</div>';
  populateFilterOptions('lost', lostRows, [{key:'utm_medium'},{key:'priority'},{key:'cohort'}]);

  out += '<h2 class="section-title">Breakdown UTM (reuniões atendidas)</h2>';
  out += '<div class="two-col">';
  const umb = m.utm_medium_break_by_course[COURSE];
  const ucb = m.utm_content_break_by_course[COURSE];
  out += '<div class="card"><h3>UTM Medium</h3>' + (umb.length ? umb.map(u=>`
      <div class="funnel-row" style="grid-template-columns:140px 1fr 40px;"><div class="fname">${esc(u[0])}</div>
      <div class="funnel-bar-track"><div class="funnel-bar-fill" style="width:${Math.max(2,100*u[1]/umb[0][1])}%"></div></div>
      <div class="fcount">${u[1]}</div></div>`).join('') : '<div class="card-desc">Sem registros para este filtro.</div>') + '</div>';
  out += '<div class="card"><h3>UTM Content / Influenciadores (Top 10)</h3>' + (ucb.length ? ucb.map(u=>`
      <div class="funnel-row" style="grid-template-columns:200px 1fr 40px;"><div class="fname" title="${esc(u[0])}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(u[0])}</div>
      <div class="funnel-bar-track"><div class="funnel-bar-fill" style="width:${Math.max(2,100*u[1]/ucb[0][1])}%"></div></div>
      <div class="fcount">${u[1]}</div></div>`).join('') : '<div class="card-desc">Sem registros para este filtro.</div>') + '</div>';
  out += '</div>';

  out += '<h2 class="section-title">Distribuição de Ciclo (criação → atendimento)</h2>';
  out += '<div class="card">' + kpiRow(Object.entries(m.ciclo_buckets_by_course[COURSE]).map(([k,v])=>({label:k, value:v}))) + '</div>';

  document.getElementById('tab-marketing').innerHTML = out;
}

function renderVendas(){
  const m = DATA;
  const attRows = filterByCourse(m.tables.attended);
  const closerRows = m.closer_rows; // agregado (todos os cursos) — poucas reuniões por closer para segmentar
  const rankRows = filterByCourse(m.ranking_potencial);

  const vendas = m.kpis_by_course.payments[COURSE].total;
  const lost = m.kpis_by_course.closed_lost[COURSE].total;
  const abertoCount = attRows.filter(r=>r.resultado!=='SUCCESSFUL PAYMENT' && r.resultado!=='CLOSED-LOST').length;
  const potA = rankRows.filter(r=>r.potencial==='A').length;

  const energias = closerRows.map(c=>c.energia).filter(v=>v!==null && v!==undefined);
  const resistencias = closerRows.map(c=>c.resistencia).filter(v=>v!==null && v!==undefined);
  const energiaMedia = energias.length ? (energias.reduce((a,b)=>a+b,0)/energias.length).toFixed(1)+'%' : 'Sem dados';
  const resistenciaMedia = resistencias.length ? (resistencias.reduce((a,b)=>a+b,0)/resistencias.length).toFixed(1)+'%' : 'Sem dados';

  let out = '';
  out += kpiRow([
    {label:'Pagamentos (ações no dia)', value: vendas, cls:'teal'},
    {label:'Em Aberto (reuniões atendidas)', value: abertoCount},
    {label:'Closed-Lost (ações no dia)', value: lost, cls:'critical'},
    {label:'Potenciais A (atendidas)', value: potA, cls:'teal'},
    {label:'Energia Média Closers', value: energiaMedia},
    {label:'Resistência Média Leads', value: resistenciaMedia},
  ]);

  out += '<h2 class="section-title">Performance por Closer <span class="pill-scope">Agregado — Todos os cursos</span></h2>';
  out += '<div class="card"><div class="card-desc">Esta tabela não é afetada pelo filtro de curso (poucas reuniões por closer para segmentar de forma confiável).</div>' +
    tbl('closerPerf', ['Closer','Reuniões','Vendas','Lost','Aberto','Taxa Conversão','Energia','Resistência'], closerRows,
      r=>`<tr><td><strong>${esc(r.closer)}</strong></td><td>${r.reunioes}</td><td>${r.vendas}</td><td>${r.lost}</td>
        <td>${r.aberto}</td><td>${r.taxa_conversao}%</td>
        <td>${r.energia!==null && r.energia!==undefined ? r.energia+'%' : '<span style="color:var(--muted);font-style:italic;">sem dados</span>'}</td>
        <td>${r.resistencia!==null && r.resistencia!==undefined ? r.resistencia+'%' : '<span style="color:var(--muted);font-style:italic;">sem dados</span>'}</td></tr>`
    ) + '</div>';

  out += '<h2 class="section-title">Ranking de Potencial de Fechamento (A / B / C)</h2>';
  out += '<div class="card">' + tbl('ranking', ['Lead','Closer','Curso','Potencial','Payable','Score','Ação Recomendada'], rankRows,
      r=>`<tr data-potencial="${esc(r.potencial)}"><td>${esc(r.dealname)}</td><td>${esc(r.closer)}</td><td>${courseBadge(r.course_cat)}</td>
        <td>${potBadge(r.potencial)}</td><td>${payBadge(r.payable)}</td><td>${esc(r.score)}</td><td>${esc(r.acao)}</td></tr>`,
      [{key:'potencial',label:'Potencial'}]
    ) + '</div>';
  populateFilterOptions('ranking', rankRows, [{key:'potencial'}]);

  out += '<h2 class="section-title">Análise Elephan (Transcrições)</h2>';
  if(m.elephan_available && m.elephan_table && m.elephan_table.length){
    out += '<div class="card">' + tbl('elephan', ['Closer','Lead','Duração (min)','Resultado','Sentimento Rep','Sentimento Lead','Resumo'], m.elephan_table,
      r=>`<tr><td>${esc(r.closer)}</td><td>${esc(r.lead)}</td><td>${esc(r.duration_min)}</td><td>${resultBadge(r.resultado)}</td>
        <td>${sentBar(r.rep_pos, r.rep_neg)}</td><td>${sentBar(r.lead_pos, r.lead_neg)}</td>
        <td style="max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${esc(r.summary)}">${esc(r.summary)}</td></tr>`
    ) + '</div>';
  } else {
    out += '<div class="card"><div class="no-data-banner"><span class="icon">🔌</span>' +
      '<strong>Conector Elephan indisponível nesta execução</strong><br>' +
      'Sentiment analysis, energia dos closers, resistência dos leads e resumos das transcrições não puderam ser coletados hoje.</div></div>';
  }

  out += '<h2 class="section-title">Alertas Críticos</h2>';
  out += '<div class="card"><ul class="chip-list">' + m.alertas.map(a=>`<li>⚠️ ${esc(a)}</li>`).join('') + '</ul></div>';

  out += '<h2 class="section-title">Recomendações de Treinamento / Ação</h2>';
  out += '<div class="card"><ul class="chip-list reco">' + m.recomendacoes.map(a=>`<li>✅ ${esc(a)}</li>`).join('') + '</ul></div>';

  document.getElementById('tab-vendas').innerHTML = out;
}

function renderAll(){ renderMarketing(); renderVendas(); }

function setCourseFilter(cat){
  COURSE = cat;
  document.querySelectorAll('#courseSeg button').forEach(b=>b.classList.toggle('active', b.dataset.cat===cat));
  renderAll();
}

function showTab(name){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
}

renderAll();
</script>
</body>
</html>
