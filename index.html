<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Fds — Sexta 28/08 + Sábado 29/08/2026 | TripleTen Brasil</title>
<style>
:root{--navy:#0f2044;--blue:#1a3a6b;--teal:#0d9488;--lteal:#14b8a6;--bg:#f0f4f8;--card:#fff;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;--green:#059669;--red:#dc2626;--orange:#d97706;--purple:#7c3aed;--yellow:#ca8a04;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
header{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:18px 28px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
header h1{font-size:20px;font-weight:800;}
header .sub{font-size:12px;opacity:0.75;margin-top:3px;}
.badge-gen{background:var(--teal);padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;}
.day-tabs{display:flex;gap:6px;padding:14px 28px;background:var(--navy);}
.day-tab{padding:8px 18px;border-radius:6px;cursor:pointer;font-weight:700;font-size:13px;border:2px solid transparent;color:#94a3b8;transition:all .2s;}
.day-tab.active{background:var(--teal);color:#fff;border-color:var(--teal);}
.day-tab:hover:not(.active){border-color:var(--lteal);color:#fff;}
.sec-tabs{display:flex;background:#fff;border-bottom:2px solid var(--border);padding:0 28px;}
.sec-tab{padding:12px 22px;cursor:pointer;font-weight:700;font-size:13px;border-bottom:3px solid transparent;color:var(--muted);transition:.2s;}
.sec-tab.active{border-bottom-color:var(--teal);color:var(--teal);}
.content{padding:18px 28px;}
/* KPIs */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px;}
.kpi{background:var(--card);border-radius:10px;padding:14px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.07);border-top:3px solid var(--teal);}
.kpi.g{border-top-color:var(--green);}
.kpi.r{border-top-color:var(--red);}
.kpi.o{border-top-color:var(--orange);}
.kpi.p{border-top-color:var(--purple);}
.kpi.y{border-top-color:var(--yellow);}
.kpi-v{font-size:26px;font-weight:900;color:var(--navy);}
.kpi-l{font-size:10px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.5px;}
.kpi-s{font-size:11px;color:var(--teal);font-weight:700;margin-top:2px;}
/* Cards */
.card{background:var(--card);border-radius:10px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:14px;}
.card h3{font-size:13px;font-weight:800;color:var(--navy);margin-bottom:12px;border-bottom:2px solid var(--border);padding-bottom:8px;display:flex;align-items:center;gap:6px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
/* Tables */
.tw{overflow-x:auto;max-height:320px;overflow-y:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{background:var(--navy);color:#fff;padding:8px 10px;text-align:left;font-weight:700;position:sticky;top:0;z-index:1;}
td{padding:6px 10px;border-bottom:1px solid var(--border);}
tr:nth-child(even) td{background:#f8fafc;}
tr:hover td{background:#e0f2fe;}
/* Badges */
.bt{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:800;}
.t-q{background:#fee2e2;color:#b91c1c;}
.t-m{background:#fef3c7;color:#92400e;}
.t-f{background:#dbeafe;color:#1d4ed8;}
.p-h{background:#dcfce7;color:#065f46;}
.p-m{background:#fef9c3;color:#92400e;}
.r-v{background:#dcfce7;color:var(--green);}
.r-l{background:#fee2e2;color:var(--red);}
.r-a{background:#e0f2fe;color:#0369a1;}
.pot-A{background:#dcfce7;color:var(--green);}
.pot-B{background:#fef3c7;color:var(--orange);}
.pot-C{background:#f1f5f9;color:#64748b;}
/* Funnel */
.funnel{display:flex;flex-direction:column;gap:5px;}
.fbar{display:flex;align-items:center;gap:8px;}
.flabel{width:175px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ftrack{flex:1;background:#f1f5f9;border-radius:4px;height:22px;overflow:hidden;}
.ffill{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:7px;color:#fff;font-size:11px;font-weight:800;min-width:28px;transition:width .5s;}
.fcount{width:36px;text-align:right;font-weight:800;font-size:12px;color:var(--navy);}
/* Closer cards */
.closer-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;}
.cc{background:#f8fafc;border-radius:8px;padding:12px;border-left:4px solid var(--teal);}
.cc.top{border-left-color:var(--green);}
.cc.warn{border-left-color:var(--orange);}
.cc-name{font-weight:800;font-size:13px;color:var(--navy);}
.cc-stats{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;}
.cs{text-align:center;min-width:55px;}
.cs .v{font-size:18px;font-weight:900;}
.cs .l{font-size:9px;color:var(--muted);text-transform:uppercase;}
/* Sentiment bar */
.sbar{display:flex;height:10px;border-radius:5px;overflow:hidden;width:100%;margin-top:8px;}
.s-pos{background:var(--green);}
.s-neg{background:var(--red);}
.s-neu{background:#94a3b8;}
/* Alerts */
.alert{background:#fff5f5;border:1px solid #fecaca;border-radius:8px;padding:10px 14px;margin-bottom:8px;}
.alert.warn{background:#fffbeb;border-color:#fde68a;}
.alert.info{background:#eff6ff;border-color:#bfdbfe;}
.alert.ok{background:#f0fdf4;border-color:#bbf7d0;}
.alert-t{font-weight:800;font-size:12px;color:var(--red);margin-bottom:3px;}
.alert-t.warn{color:var(--orange);}
.alert-t.info{color:#1d4ed8;}
.alert-t.ok{color:var(--green);}
/* Split section */
.split-card{background:var(--card);border-radius:10px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:14px;}
.split-card h3{font-size:13px;font-weight:800;color:var(--navy);margin-bottom:12px;border-bottom:2px solid var(--border);padding-bottom:8px;}
.split-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.split-section{border:1px solid var(--border);border-radius:8px;padding:12px;}
.split-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.split-title.hoje{color:var(--teal);}
.split-title.total{color:var(--navy);}
.mini-kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.mini-kpi{text-align:center;background:#f8fafc;border-radius:6px;padding:8px 4px;}
.mini-kpi .v{font-size:18px;font-weight:900;color:var(--navy);}
.mini-kpi .l{font-size:9px;color:var(--muted);text-transform:uppercase;}
.mini-kpi .s{font-size:10px;color:var(--muted);margin-top:1px;}
.bar-compare{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.bc-label{width:120px;font-size:11px;color:var(--muted);}
.bc-track{flex:1;background:#f1f5f9;border-radius:3px;height:16px;overflow:hidden;display:flex;}
.bc-hoje{background:var(--teal);height:100%;display:flex;align-items:center;padding:0 4px;color:#fff;font-size:9px;font-weight:700;}
.bc-outros{background:#94a3b8;height:100%;display:flex;align-items:center;padding:0 4px;color:#fff;font-size:9px;font-weight:700;}
.bc-total{width:30px;text-align:right;font-size:11px;font-weight:800;color:var(--navy);}
</style>
</head>
<body>

<header>
  <div>
    <h1>🎯 Dashboard Fds — Sexta 28/08 + Sábado 29/08/2026</h1>
    <div class="sub">TripleTen Brasil · Pipeline: Brazil / Sales · Gerado automaticamente toda segunda-feira</div>
  </div>
  <div class="badge-gen">Segunda 01/09/2026</div>
</header>

<div class="day-tabs">
  <button class="day-tab active" onclick="switchDay('sexta')">📅 Sexta-feira 28/08</button>
  <button class="day-tab" onclick="switchDay('sabado')">📅 Sábado 29/08</button>
  <button class="day-tab" onclick="switchDay('consolidado')">📊 Consolidado Fds</button>
</div>

<div class="sec-tabs">
  <div class="sec-tab active" onclick="switchTab('marketing')">📈 Marketing</div>
  <div class="sec-tab" onclick="switchTab('vendas')">🎯 Vendas</div>
</div>

<div class="content" id="main-content"></div>

<script>
// ===== DADOS CORRIGIDOS FORNECIDOS PELA SABRINA =====
const DATA = {
  sexta: {
    label: 'Sexta-feira 28/08',
    // Leads criados no dia
    hoje: { criados:218, pagamentos:1, closed_lost:3, agendadas:30, noshows:2, atendidas:12 },
    // Total de ações do dia (leads de todos os dias)
    total: { pagamentos:4, closed_lost:216, agendadas:85, noshows:20, atendidas:33 },
    // Elefan transcriptions closers
    closers: [
      {name:"Erick Paiva",meetings:5,total_min:157.4,avg_min:31.5,energia:42,resistencia:9},
      {name:"Daniel Augusto Macedo Ribeiro",meetings:4,total_min:210.8,avg_min:52.7,energia:30,resistencia:13},
      {name:"Lucas Bonow",meetings:4,total_min:132.9,avg_min:33.2,energia:56,resistencia:5},
      {name:"Yanara Silva",meetings:4,total_min:111.2,avg_min:27.8,energia:41,resistencia:6},
      {name:"Bernardo Magalhaes",meetings:3,total_min:131.0,avg_min:43.7,energia:23,resistencia:8},
      {name:"Bruno Marques",meetings:3,total_min:136.0,avg_min:45.3,energia:32,resistencia:19},
      {name:"Raisa Fernandes",meetings:3,total_min:185.2,avg_min:61.7,energia:29,resistencia:1},
      {name:"Vinicius Leao",meetings:3,total_min:107.8,avg_min:35.9,energia:58,resistencia:4},
      {name:"Raphael Soares Luna",meetings:2,total_min:58.0,avg_min:29.0,energia:46,resistencia:9},
      {name:"Ana Viana",meetings:1,total_min:73.3,avg_min:73.3,energia:22,resistencia:17},
      {name:"Veronica Rocha",meetings:1,total_min:47.4,avg_min:47.4,energia:40,resistencia:0}
    ],
    total_transcricoes: 33
  },
  sabado: {
    label: 'Sábado 29/08',
    hoje: { criados:239, pagamentos:0, closed_lost:3, agendadas:26, noshows:19, atendidas:12 },
    total: { pagamentos:2, closed_lost:25, agendadas:70, noshows:55, atendidas:19 },
    closers: [
      {name:"Jessica Silva",meetings:5,total_min:260.2,avg_min:52.0,energia:35,resistencia:9},
      {name:"Bruno Marques",meetings:4,total_min:211.2,avg_min:52.8,energia:39,resistencia:7},
      {name:"Vinicius Leao",meetings:4,total_min:201.9,avg_min:50.5,energia:46,resistencia:11},
      {name:"Veronica Rocha",meetings:3,total_min:133.2,avg_min:44.4,energia:19,resistencia:14},
      {name:"Erick Paiva",meetings:1,total_min:65.1,avg_min:65.1,energia:32,resistencia:14}
    ],
    total_transcricoes: 17
  }
};

DATA.consolidado = {
  label: 'Consolidado Fds',
  hoje: {
    criados: DATA.sexta.hoje.criados + DATA.sabado.hoje.criados,
    pagamentos: DATA.sexta.hoje.pagamentos + DATA.sabado.hoje.pagamentos,
    closed_lost: DATA.sexta.hoje.closed_lost + DATA.sabado.hoje.closed_lost,
    agendadas: DATA.sexta.hoje.agendadas + DATA.sabado.hoje.agendadas,
    noshows: DATA.sexta.hoje.noshows + DATA.sabado.hoje.noshows,
    atendidas: DATA.sexta.hoje.atendidas + DATA.sabado.hoje.atendidas
  },
  total: {
    pagamentos: DATA.sexta.total.pagamentos + DATA.sabado.total.pagamentos,
    closed_lost: DATA.sexta.total.closed_lost + DATA.sabado.total.closed_lost,
    agendadas: DATA.sexta.total.agendadas + DATA.sabado.total.agendadas,
    noshows: DATA.sexta.total.noshows + DATA.sabado.total.noshows,
    atendidas: DATA.sexta.total.atendidas + DATA.sabado.total.atendidas
  },
  closers: (() => {
    const m = {};
    [...DATA.sexta.closers, ...DATA.sabado.closers].forEach(c => {
      if(!m[c.name]) m[c.name] = {name:c.name,meetings:0,total_min:0,e_sum:0,r_sum:0};
      m[c.name].meetings += c.meetings;
      m[c.name].total_min += c.total_min;
      m[c.name].e_sum += c.energia * c.meetings;
      m[c.name].r_sum += c.resistencia * c.meetings;
    });
    return Object.values(m).map(c => ({
      ...c,
      avg_min: +(c.total_min/c.meetings).toFixed(1),
      energia: Math.round(c.e_sum/c.meetings),
      resistencia: Math.round(c.r_sum/c.meetings)
    })).sort((a,b) => b.meetings - a.meetings);
  })(),
  total_transcricoes: DATA.sexta.total_transcricoes + DATA.sabado.total_transcricoes
};

let currentDay = 'sexta', currentTab = 'marketing';

function switchDay(d){ currentDay=d; document.querySelectorAll('.day-tab').forEach((t,i)=>t.classList.toggle('active',['sexta','sabado','consolidado'][i]===d)); render(); }
function switchTab(t){ currentTab=t; document.querySelectorAll('.sec-tab').forEach((s,i)=>s.classList.toggle('active',['marketing','vendas'][i]===t)); render(); }
function pct(a,b){ return b>0?Math.round(a/b*100)+'%':'—'; }
function pctN(a,b){ return b>0?(a/b*100).toFixed(1)+'%':'—'; }

function sentBar(pos,neg){
  const neu = Math.max(0,100-pos-neg);
  return `<div class="sbar" title="Energia:${pos}% Neutro:${neu}% Atrito:${neg}%">
    <div class="s-pos" style="width:${pos}%"></div>
    <div class="s-neu" style="width:${neu}%"></div>
    <div class="s-neg" style="width:${neg}%"></div>
  </div>`;
}

function closerClass(c){
  if(c.energia>=50 && c.resistencia<10) return 'top';
  if(c.resistencia>15 || c.energia<25) return 'warn';
  return '';
}

function renderMarketing(d){
  const h = d.hoje, tot = d.total;
  const noshow_rate_hoje = h.atendidas+h.noshows>0 ? pctN(h.noshows,h.atendidas+h.noshows) : '—';
  const noshow_rate_tot = tot.atendidas+tot.noshows>0 ? pctN(tot.noshows,tot.atendidas+tot.noshows) : '—';
  const conv_hoje = pctN(h.atendidas, h.criados);

  // Funnel do total do dia
  const funnelMax = Math.max(tot.agendadas, tot.atendidas, tot.noshows, tot.closed_lost, tot.pagamentos);
  const colors = ['linear-gradient(90deg,#0d9488,#14b8a6)','linear-gradient(90deg,#1a3a6b,#2563eb)','linear-gradient(90deg,#d97706,#f59e0b)','linear-gradient(90deg,#dc2626,#f87171)','linear-gradient(90deg,#059669,#34d399)'];
  const funnelItems = [
    ['Reuniões Agendadas',tot.agendadas],
    ['Reuniões Atendidas',tot.atendidas],
    ['No-Shows',tot.noshows],
    ['Closed-Lost',tot.closed_lost],
    ['Vendas 💰',tot.pagamentos]
  ];
  const funnelHTML = funnelItems.map(([label,val],i)=>`
    <div class="fbar">
      <div class="flabel">${label}</div>
      <div class="ftrack"><div class="ffill" style="width:${funnelMax>0?Math.round(val/funnelMax*100):0}%;background:${colors[i]}">${val}</div></div>
      <div class="fcount">${val}</div>
    </div>`).join('');

  // Split: leads do dia vs outros dias
  const splitRows = [
    {label:'Reuniões Agend.',hoje:h.agendadas,total:tot.agendadas},
    {label:'Atendidas',hoje:h.atendidas,total:tot.atendidas},
    {label:'No-Shows',hoje:h.noshows,total:tot.noshows},
    {label:'Closed-Lost',hoje:h.closed_lost,total:tot.closed_lost},
    {label:'Vendas',hoje:h.pagamentos,total:tot.pagamentos}
  ];
  const splitHTML = splitRows.map(r=>{
    const outros = r.total - r.hoje;
    const pHoje = r.total>0?Math.round(r.hoje/r.total*100):0;
    const pOutros = 100-pHoje;
    return `<div class="bar-compare">
      <div class="bc-label">${r.label}</div>
      <div class="bc-track">
        <div class="bc-hoje" style="width:${pHoje}%" title="Leads criados hoje: ${r.hoje}">${r.hoje}</div>
        <div class="bc-outros" style="width:${pOutros}%" title="Leads de outros dias: ${outros}">${outros}</div>
      </div>
      <div class="bc-total">${r.total}</div>
    </div>`;}).join('');

  return `
  <!-- KPIs LEADS DO DIA -->
  <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--teal);margin-bottom:8px;">📌 Leads Criados em ${d.label}</div>
  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-v">${h.criados}</div><div class="kpi-l">Leads Criados</div></div>
    <div class="kpi g"><div class="kpi-v">${h.atendidas}</div><div class="kpi-l">Reuniões Atendidas</div><div class="kpi-s">${conv_hoje} dos criados</div></div>
    <div class="kpi o"><div class="kpi-v">${h.agendadas}</div><div class="kpi-l">Meeting Scheduled</div></div>
    <div class="kpi r"><div class="kpi-v">${h.noshows}</div><div class="kpi-l">No-Shows</div><div class="kpi-s">Taxa: ${noshow_rate_hoje}</div></div>
    <div class="kpi y"><div class="kpi-v">${h.closed_lost}</div><div class="kpi-l">Closed-Lost</div></div>
    <div class="kpi p"><div class="kpi-v">${h.pagamentos}</div><div class="kpi-l">Vendas 💰</div></div>
  </div>

  <!-- KPIs TOTAL DO DIA -->
  <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--navy);margin-bottom:8px;margin-top:4px;">📊 Total de Ações no Dia (todos os leads)</div>
  <div class="kpi-grid">
    <div class="kpi g"><div class="kpi-v">${tot.atendidas}</div><div class="kpi-l">Atendidas Total</div><div class="kpi-s">${h.atendidas} de hoje</div></div>
    <div class="kpi o"><div class="kpi-v">${tot.agendadas}</div><div class="kpi-l">Agendadas Total</div><div class="kpi-s">${h.agendadas} de hoje</div></div>
    <div class="kpi r"><div class="kpi-v">${tot.noshows}</div><div class="kpi-l">No-Shows Total</div><div class="kpi-s">Taxa: ${noshow_rate_tot}</div></div>
    <div class="kpi y"><div class="kpi-v">${tot.closed_lost}</div><div class="kpi-l">Closed-Lost Total</div></div>
    <div class="kpi p"><div class="kpi-v">${tot.pagamentos}</div><div class="kpi-l">Vendas Total 💰</div><div class="kpi-s">${h.pagamentos} de hoje</div></div>
    <div class="kpi"><div class="kpi-v">${pct(tot.pagamentos,tot.atendidas)}</div><div class="kpi-l">Conv. Atend.→Venda</div></div>
  </div>

  <div class="grid2">
    <div class="card">
      <h3>🔽 Funil do Dia — Total de Ações</h3>
      <div class="funnel">${funnelHTML}</div>
    </div>
    <div class="card">
      <h3>📊 Leads de Hoje vs. Outros Dias</h3>
      <div style="display:flex;gap:12px;margin-bottom:10px;font-size:11px;">
        <span style="display:flex;align-items:center;gap:4px;"><span style="width:12px;height:12px;background:var(--teal);border-radius:2px;display:inline-block"></span> Leads de hoje</span>
        <span style="display:flex;align-items:center;gap:4px;"><span style="width:12px;height:12px;background:#94a3b8;border-radius:2px;display:inline-block"></span> Leads de outros dias</span>
      </div>
      ${splitHTML}
      <div style="font-size:10px;color:var(--muted);margin-top:8px;">Total = número à direita | barras proporcional ao mix</div>
    </div>
  </div>
  `;
}

function renderVendas(d){
  const h = d.hoje, tot = d.total;
  const conv_total = tot.atendidas>0 ? pctN(tot.pagamentos,tot.atendidas) : '—';
  const noshow_pct = (tot.atendidas+tot.noshows)>0 ? pctN(tot.noshows,tot.atendidas+tot.noshows) : '—';

  // Closer cards
  const closerCards = d.closers.map(c => {
    const cls = closerClass(c);
    const emoji = c.energia>=50?'🟢':c.resistencia>15?'🔴':c.energia<25?'🟡':'🔵';
    return `<div class="cc ${cls}">
      <div class="cc-name">${emoji} ${c.name}</div>
      <div class="cc-stats">
        <div class="cs"><div class="v" style="color:var(--teal)">${c.meetings}</div><div class="l">Reuniões</div></div>
        <div class="cs"><div class="v">${c.avg_min}m</div><div class="l">Duração/r</div></div>
        <div class="cs"><div class="v" style="color:var(--green)">${c.energia}%</div><div class="l">Energia ✓</div></div>
        <div class="cs"><div class="v" style="color:var(--red)">${c.resistencia}%</div><div class="l">Atrito 🎯</div></div>
        <div class="cs"><div class="v">${c.total_min.toFixed(0)}m</div><div class="l">Total</div></div>
      </div>
      ${sentBar(c.energia,c.resistencia)}
    </div>`;
  }).join('') || '<div style="color:var(--muted);padding:20px;text-align:center">Sem transcrições Elephan para o período</div>';

  // Alerts
  const noshow_num = parseFloat(noshow_pct);
  let alerts = '';
  if(noshow_num > 60) alerts += `<div class="alert"><div class="alert-t">🚨 Taxa de No-Show Crítica: ${noshow_pct}</div>Mais de 60% dos agendamentos não compareceram. Revisar urgentemente o fluxo de confirmação e lembretes automáticos.</div>`;
  else if(noshow_num > 40) alerts += `<div class="alert warn"><div class="alert-t warn">⚠️ Taxa de No-Show Elevada: ${noshow_pct}</div>Revisar processo de confirmação de reuniões — considerar SMS/WhatsApp de lembrete no dia anterior.</div>`;

  const highAtrito = d.closers.filter(c=>c.resistencia>15);
  if(highAtrito.length>0) alerts += `<div class="alert warn"><div class="alert-t warn">⚠️ Closers com Alto Atrito</div>${highAtrito.map(c=>c.name).join(', ')} apresentaram >15% de sentimento negativo. Recomendar revisão de objeções frequentes.</div>`;

  const lowEnergia = d.closers.filter(c=>c.energia<25);
  if(lowEnergia.length>0) alerts += `<div class="alert warn"><div class="alert-t warn">⚠️ Baixa Energia em Reuniões</div>${lowEnergia.map(c=>c.name).join(', ')} com energia abaixo de 25%. Verificar se estão com muitas reuniões seguidas ou precisam de suporte.</div>`;

  if(tot.pagamentos===0) alerts += `<div class="alert"><div class="alert-t">🚨 Nenhuma Venda no Dia</div>Zero conversões em ${tot.atendidas} reuniões atendidas. Analisar gravações para identificar padrão de objeções.</div>`;
  else if(tot.pagamentos < 3) alerts += `<div class="alert warn"><div class="alert-t warn">⚠️ Volume Baixo de Vendas</div>Apenas ${tot.pagamentos} venda(s) em ${tot.atendidas} reuniões (${conv_total} de conversão). Meta: acima de 10%.</div>`;
  else alerts += `<div class="alert ok"><div class="alert-t ok">✅ Conversão dentro do esperado</div>${tot.pagamentos} vendas em ${tot.atendidas} reuniões (${conv_total}).</div>`;

  // Top performers
  const topE = [...d.closers].sort((a,b)=>b.energia-a.energia).slice(0,3);
  const topRows = topE.map(c=>`<tr>
    <td><strong>${c.name}</strong></td>
    <td>${c.meetings}</td>
    <td>${c.avg_min}min</td>
    <td><span style="color:var(--green);font-weight:800">${c.energia}%</span></td>
    <td><span style="color:var(--red);font-weight:800">${c.resistencia}%</span></td>
    <td>${sentBar(c.energia,c.resistencia)}</td>
  </tr>`).join('');

  const allRows = d.closers.map(c=>`<tr>
    <td>${c.name}</td>
    <td>${c.meetings}</td>
    <td>${c.total_min.toFixed(0)}min</td>
    <td>${c.avg_min}min</td>
    <td>${c.energia}%</td>
    <td>${c.resistencia}%</td>
    <td>${sentBar(c.energia,c.resistencia)}</td>
  </tr>`).join('') || '<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:20px">Sem dados Elephan para o período</td></tr>';

  return `
  <div class="kpi-grid">
    <div class="kpi p"><div class="kpi-v">${tot.pagamentos}</div><div class="kpi-l">Vendas Totais 💰</div><div class="kpi-s">${h.pagamentos} de leads de hoje</div></div>
    <div class="kpi g"><div class="kpi-v">${conv_total}</div><div class="kpi-l">Conv. Atend.→Venda</div></div>
    <div class="kpi r"><div class="kpi-v">${noshow_pct}</div><div class="kpi-l">Taxa No-Show</div><div class="kpi-s">${tot.noshows} de ${tot.atendidas+tot.noshows}</div></div>
    <div class="kpi o"><div class="kpi-v">${d.closers.length}</div><div class="kpi-l">Closers Ativos</div><div class="kpi-s">${d.total_transcricoes} transcrições</div></div>
    <div class="kpi"><div class="kpi-v">${d.closers.length>0?Math.round(d.closers.reduce((s,c)=>s+c.energia,0)/d.closers.length):0}%</div><div class="kpi-l">Energia Média</div></div>
    <div class="kpi y"><div class="kpi-v">${d.closers.length>0?Math.round(d.closers.reduce((s,c)=>s+c.resistencia,0)/d.closers.length):0}%</div><div class="kpi-l">Atrito Médio</div></div>
  </div>

  <div class="card">
    <h3>🎙️ Performance Elephan — Todos os Closers (${d.total_transcricoes} transcrições)</h3>
    <div class="closer-grid">${closerCards}</div>
  </div>

  <div class="card">
    <h3>📊 Tabela Detalhada por Closer</h3>
    <div class="tw">
      <table>
        <thead><tr><th>Closer</th><th>Reuniões</th><th>Total</th><th>Média/r</th><th>Energia</th><th>Atrito Lead</th><th>Sentiment</th></tr></thead>
        <tbody>${allRows}</tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h3>🚨 Alertas e Análise</h3>
    ${alerts}
  </div>

  <div class="card">
    <h3>📚 Recomendações para esta Semana</h3>
    <div class="alert info"><div class="alert-t info">💡 Ações Prioritárias — Segunda 01/09</div>
    <ul style="margin-top:8px;padding-left:18px;font-size:12px;line-height:2">
      ${tot.noshows>30?'<li>🔴 <strong>Reduzir no-shows</strong> — implementar confirmação automática via WhatsApp 2h antes da reunião</li>':''}
      ${highAtrito.length>0?`<li>🟡 <strong>Role-play de objeções</strong> com ${highAtrito.map(c=>c.name.split(' ')[0]).join(', ')} — alto atrito detectado nas transcrições</li>`:''}
      ${d.closers.filter(c=>c.energia>=50).length>0?`<li>🟢 <strong>Boas práticas</strong> — ${d.closers.filter(c=>c.energia>=50).map(c=>c.name.split(' ')[0]).join(', ')} com alta energia, solicitar que compartilhem técnicas com o time</li>`:''}
      <li>📞 <strong>Recontato urgente</strong> dos no-shows com alta prioridade — janela ótima é nas primeiras 2h</li>
      <li>📊 <strong>Análise de deals</strong> — ${tot.closed_lost} closed-losts no dia: identificar padrão de objeção mais comum</li>
    </ul></div>
  </div>
  `;
}

function render(){
  const d = DATA[currentDay];
  document.getElementById('main-content').innerHTML = currentTab==='marketing' ? renderMarketing(d) : renderVendas(d);
}

render();
</script>
</body>
</html>
