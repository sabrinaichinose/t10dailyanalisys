[['leadsCriados',leadsRows,['utm_medium','priority','temperatura']],['sched',schedRows,['utm_medium','priority','cohort']],['noshow',nsRows,['utm_medium','priority','cohort']],['attFull',attRows,['utm_medium','priority','temperatura','cohort']],['lost',lostRows,['utm_medium','priority','cohort']]].forEach(([id,rows,ks])=>{ks.forEach(k=>{const s=document.querySelector(`#filters-${id} select[data-col="${k}"]`);if(!s)return;const lab=s.options[0].textContent;const vals=[...new Set(rows.map(r=>r[k]).filter(v=>v!==undefined&&v!==null&&v!==''))].sort();vals.forEach(v=>{const op=document.createElement('option');op.value=v;op.textContent=v;s.appendChild(op);});});});}
function renderVendas(){const m=DATA;const attRows=filterByCourse(m.tables.attended),cr=m.closer_rows,rk=filterByCourse(m.ranking_potencial);
const vendas=m.kpis_by_course.payments[COURSE].total,lost=m.kpis_by_course.closed_lost[COURSE].total;
const ab=attRows.filter(r=>r.resultado!=='SUCCESSFUL PAYMENT'&&r.resultado!=='CLOSED-LOST').length,potA=rk.filter(r=>r.potencial==='A').length;
const en=cr.map(c=>c.energia).filter(v=>v!==null&&v!==undefined),re=cr.map(c=>c.resistencia).filter(v=>v!==null&&v!==undefined);
const avg=a=>a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1)+'%':'Sem dados';
const nd='<span style="color:var(--muted);font-style:italic;">sem dados</span>';
let o=kpiRow([{label:'Pagamentos (ações no dia)',value:vendas,cls:'teal'},{label:'Em Aberto (reuniões atendidas)',value:ab},{label:'Closed-Lost (ações no dia)',value:lost,cls:'critical'},{label:'Potenciais A (atendidas)',value:potA,cls:'teal'},{label:'Energia Média Closers',value:avg(en)},{label:'Resistência Média Leads',value:avg(re)}]);
o+='<h2 class="section-title">Performance por Closer <span class="pill-scope">Agregado — Todos os cursos</span></h2><div class="card"><div class="card-desc">Esta tabela não é afetada pelo filtro de curso (poucas reuniões por closer para segmentar de forma confiável).</div>'+tbl('closerPerf',['Closer','Reuniões','Vendas','Lost','Aberto','Taxa Conversão','Energia','Resistência'],cr,r=>`<tr><td><strong>${esc(r.closer)}</strong></td><td>${r.reunioes}</td><td>${r.vendas}</td><td>${r.lost}</td><td>${r.aberto}</td><td>${r.taxa_conversao}%</td><td>${r.energia!==null&&r.energia!==undefined?r.energia+'%':nd}</td><td>${r.resistencia!==null&&r.resistencia!==undefined?r.resistencia+'%':nd}</td></tr>`)+'</div>';
o+='<h2 class="section-title">Ranking de Potencial de Fechamento (A / B / C)</h2><div class="card">'+tbl('ranking',['Lead','Closer','Curso','Potencial','Payable','Score','Ação Recomendada'],rk,r=>`<tr data-potencial="${esc(r.potencial)}"><td>${esc(r.dealname)}</td><td>${esc(r.closer)}</td><td>${courseBadge(r.course_cat)}</td><td>${potBadge(r.potencial)}</td><td>${payBadge(r.payable)}</td><td>${esc(r.score)}</td><td>${esc(r.acao)}</td></tr>`,[{key:'potencial',label:'Potencial'}])+'</div>';
const rb=m.closed_lost_reason_breakdown||[],rbT=rb.reduce((a,r)=>a+r.count,0);
o+='<h2 class="section-title">Motivos de Closed-Lost <span class="pill-scope">Total do dia — não filtrado por curso</span></h2><div class="card"><div class="card-desc">Todos os motivos de fechamento perdido registrados em '+m.target_date_br+'. Os marcados como "Excluído" ('+esc(m.closed_lost_excluidos_count)+' negócios) são problemas de qualidade de dado (duplicidade ou número errado), não perdas reais, e não entram no KPI "Closed-Lost".</div><div class="table-scroll"><table><thead><tr><th>Motivo</th><th>Quantidade</th><th>Status</th></tr></thead><tbody>'+rb.map(r=>`<tr><td>${esc(r.reason)}</td><td>${r.count}</td><td>${r.excluded?'<span class="badge badge-result-lost">Excluído</span>':'<span class="badge badge-result-win">Conta no total</span>'}</td></tr>`).join('')+`<tr style="font-weight:700;"><td>Total bruto</td><td>${rbT}</td><td></td></tr></tbody></table></div></div>`;
o+='<h2 class="section-title">Análise Elephan (Transcrições)</h2>';
if(m.elephan_available&&m.elephan_table&&m.elephan_table.length){o+='<div class="card">'+tbl('elephan',['Closer','Lead','Duração (min)','Resultado','Sentimento Rep','Sentimento Lead','Resumo'],m.elephan_table,r=>`<tr><td>${esc(r.closer)}</td><td>${esc(r.lead)}</td><td>${esc(r.duration_min)}</td><td>${resultBadge(r.resultado)}</td><td>${sentBar(r.rep_pos,r.rep_neg)}</td><td>${sentBar(r.lead_pos,r.lead_neg)}</td><td style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${esc(r.summary)}">${esc(r.summary)}</td></tr>`)+'</div>';}
else{o+='<div class="card"><div class="no-data-banner"><strong>Conector Elephan indisponível nesta execução</strong><br>Sentiment analysis, energia dos closers, resistência dos leads e resumos não puderam ser coletados hoje.</div></div>';}
o+='<h2 class="section-title">Alertas Críticos</h2><div class="card"><ul class="chip-list">'+m.alertas.map(a=>`<li>⚠️ ${esc(a)}</li>`).join('')+'</ul></div>';
o+='<h2 class="section-title">Recomendações de Treinamento / Ação</h2><div class="card"><ul class="chip-list reco">'+m.recomendacoes.map(a=>`<li>✅ ${esc(a)}</li>`).join('')+'</ul></div>';
document.getElementById('tab-vendas').innerHTML=o;
document.querySelectorAll('#filters-ranking select').forEach(s=>{[...new Set(rk.map(r=>r.potencial))].sort().forEach(v=>{const op=document.createElement('option');op.value=v;op.textContent=v;s.appendChild(op);});});}
function renderAll(){renderMarketing();renderVendas();}
function setCourseFilter(c){COURSE=c;document.querySelectorAll('#courseSeg button').forEach(b=>b.classList.toggle('active',b.dataset.cat===c));renderAll();}
function showTab(n,btn){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));btn.classList.add('active');document.getElementById('tab-'+n).classList.add('active');}
renderAll();
</script></body></html>
